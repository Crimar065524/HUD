<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Smart TV UI</title>

        <style>
            :root {
                --bg: rgb(10,10,10);
                --text: rgb(255,255,255);
                --card: rgb(30, 30, 30);
                --card-hover: rgb(20, 20, 20);
                --border: rgba(0,0,0);
            }

            .light {
                --bg: rgb(255, 255, 255);
                --text: rgb(0, 0, 0);
                --card: rgb(190,190,190);
                --card-hover: rgb(160, 160, 160);
                --border: rgb(160,160,160);
            }
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:Arial, Helvetica, sans-serif;
            }

            body{
                background: var(--bg);
                color: var(--text);
                overflow: hidden;
            }

            /* LAYOUT */
            .container{
                display:flex;
                height:100vh;
            }

            /* SIDEBAR */
            .sidebar {
                width: 10%;
                height: 100%;
                background: var(--bg);
                border-right: 2px solid var(--border);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: sticky;
                padding: 0.5% 0.5%;
                border-radius: 10px;
                gap: 50px;
            }

            .side-btn {
                width: 80%;
                height: 80px;
                border-radius: 14px;
                background: var(--card);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 40px;
                cursor: pointer;
                transition: .2s;
            }
            .side-btn:hover{
                background:var(--card-hover);
            }

            /* CONTENT */
            .content{
                flex:1;
                padding:25px;
            }

            /* HERO */
            .hero{
                height: 50%;
                width: 100%;
                border-radius:24px;
                background:linear-gradient(130deg,#ff4d4d,#ff2c8c,#344dff);
                padding:35px;
                display:flex;
                flex-direction:column;
                justify-content:center;
                position:relative;
                overflow:hidden;
            }

            .hero::after{
                content:'';
                position:absolute;
                right:-120px;
                top:-40px;
                width:420px;
                height:420px;
                border-radius:50%;
                background:rgba(255,255,255,0.08);
            }

            .hero h1{
                font-size:72px;
                font-weight:900;
                line-height:0.95;
                z-index:2;
            }

            .hero p{
                font-size:22px;
                margin-top:10px;
                opacity:0.9;
                z-index:2;
            }
            /* APPS */
            .row-title{
                margin-top:28px;
                margin-bottom:14px;
                font-size:50px;
                font-weight:700;
            }

            .apps{
                display:flex;
                gap:20px;
                margin-bottom:20px;
                height: 50%;
                width: 100%;
            }

            .app{
                width:10%;
                height: 30%;
                border-radius:18px;
                background:var(--card);
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:32px;
                transition:.2s;
                cursor:pointer;
            }

            .app:hover{
                transform:scale(1.08);
                background: var(--card-hover);
            }
        </style>
        <script>
            const theme = localStorage.getItem("theme");
            if (theme === "light") document.documentElement.classList.add("light");
        </script>
    </head>

    <body>
        <div id="app-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; background:#000;">
            <button onclick="chiudiApp()" style="position:absolute; top:20px; right:20px; z-index:10000; padding:10px 20px; border-radius:10px; cursor:pointer; background:rgba(255,255,255,0.2); color:white; border:none;">✖ Chiudi App</button>
            <iframe id="schermo-tv" src="about:blank" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <div class="container">
        
            <div class="sidebar">
                <div class="side-btn">🏠</div>
                <div class="side-btn">🎵</div>
                <div class="side-btn" onclick="window.open('Impostazioni.htm','_self')">⚙️</div>
            </div>
            
            <div class="content">
            
                <div class="hero">
                    <h1>MyView<br>Smart Hub</h1>
                    <p>Dashboard moderna per FiveM</p>
                </div>
                <div class="row-title">Apps</div>
                
                <div class="apps">
                    <div class="app" onclick="window.open('Eloratube.htm','_self')">▶️</div>
                    <div class="app">🎵</div>
                    <div class="app">🌐</div>
                    <div class="app" onclick="caricaApp('https://www.gamepix.com/it/play/x2-block-match')" >🕹️</div>
                    <div class="app">💬</div>
                    <div class="app" onclick="window.open('Impostazioni.htm','_self')">⚙️</div>
                </div>
            </div>
        </div>
        <script>
            function applySettings() {
                const brightness = localStorage.getItem("brightness") || 100;
                const theme = localStorage.getItem("theme") || "dark";
                const color = localStorage.getItem("color") || "#ff0000";

                // luminosità
                document.body.style.filter = `brightness(${brightness}%)`;

                // tema
                document.body.classList.toggle("light", theme === "light");

                // colore principale
                document.documentElement.style.setProperty('--main-color', color);
            }
           function caricaApp(url) {
                const overlay = document.getElementById('app-overlay');
                const iframe = document.getElementById('schermo-tv');
                
                iframe.src = url;
                overlay.style.display = 'block'; // Mostra l'app
            }

            function chiudiApp() {
                const overlay = document.getElementById('app-overlay');
                const iframe = document.getElementById('schermo-tv');
                
                overlay.style.display = 'none'; // Nasconde l'app
                iframe.src = 'about:blank'; // Svuota l'iframe per fermare audio/video
            }
            
            applySettings();
        </script>
    </body>
</html>
